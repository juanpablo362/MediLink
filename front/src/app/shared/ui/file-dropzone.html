<label
  [for]="inputId()"
  class="flex cursor-pointer items-center gap-3 rounded-xl border-2 border-dashed px-3 py-3 text-left transition sm:flex-col sm:items-center sm:gap-2 sm:px-4 sm:py-6 sm:text-center"
  [class]="
    arrastrando()
      ? 'border-ink-500 bg-ink-50'
      : disabled()
        ? 'cursor-not-allowed border-bone-200 bg-bone-50 opacity-60'
        : 'border-bone-300 bg-bone-0 hover:border-ink-400 hover:bg-ink-50/40'
  "
  (dragover)="onDragOver($event)"
  (dragleave)="arrastrando.set(false)"
  (drop)="onDrop($event)"
>
  <span class="grid size-9 shrink-0 place-items-center rounded-full bg-ink-50 text-ink-700 sm:size-10" aria-hidden="true">
    <i class="pi pi-cloud-upload"></i>
  </span>
  <span class="min-w-0 flex-1 sm:flex-none">
    <span class="block text-sm font-semibold text-ink-900 sm:hidden">
      Subir archivo PDF o DICOM
    </span>
    <span class="hidden text-sm font-semibold text-ink-900 sm:block">
      Arrastra archivos aquí o <span class="text-coral-700 underline underline-offset-2">elige del equipo</span>
    </span>
    <span class="mt-0.5 block text-xs text-bone-500">PDF o DICOM (.dcm), hasta 500 MB</span>
  </span>
  <input
    [id]="inputId()"
    type="file"
    class="sr-only"
    accept=".pdf,.dcm,.dicom,application/pdf,application/dicom"
    multiple
    [disabled]="disabled()"
    (change)="onInput($event)"
  />
</label>
@if (error()) {
  <p class="field-error" role="alert"><i class="pi pi-exclamation-circle" aria-hidden="true"></i>{{ error() }}</p>
}
